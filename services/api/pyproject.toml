[project]
name = "campuscart-api"
version = "0.0.0"
description = "CampusCart backend API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143,<0.144",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic-settings>=2.15,<3",
    "psycopg[binary,pool]>=3.3,<3.4",
    "pyjwt[crypto]>=2.15,<3",
    "httpx2>=2.13,<3",  # outbound calls to Razorpay and Expo push
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "websockets>=17,<18",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the local Supabase stack (pnpm db:start); skipped when its env vars are absent",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "tests"]
