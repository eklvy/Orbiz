name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: TypeScript workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  api:
    name: Python API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q -m "not integration"

  database:
    name: Database (migrations, RLS, integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (only the services the tests need)
        run: pnpm exec supabase start -x studio,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: pnpm exec supabase db reset
      - run: pnpm exec supabase test db
      - name: Install API
        run: |
          python -m venv services/api/.venv
          services/api/.venv/bin/pip install -e "services/api[dev]"
      - name: Generated API contracts are up to date
        run: bash scripts/check-contracts.sh
      - name: API integration tests (incl. concurrency, Realtime latency, pg_cron expiry)
        run: |
          eval "$(bash scripts/supabase-env.sh)"
          cd services/api && .venv/bin/pytest -q -m integration -s
