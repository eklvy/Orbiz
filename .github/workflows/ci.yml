name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: TypeScript workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Student mobile iOS + Android bundles
        run: pnpm --filter @campuscart/student-mobile export:native
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:8100
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  api:
    name: Python API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q -m "not integration"

  database:
    name: Database (migrations, RLS, integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (only the services the tests need)
        run: pnpm exec supabase start -x studio,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: pnpm exec supabase db reset
      - run: pnpm exec supabase test db
      - name: Install API
        run: |
          python -m venv services/api/.venv
          services/api/.venv/bin/pip install -e "services/api[dev]"
      - name: Generated API contracts are up to date
        run: bash scripts/check-contracts.sh
      - name: API integration tests (incl. concurrency, Realtime latency, pg_cron expiry)
        run: |
          eval "$(bash scripts/supabase-env.sh)"
          cd services/api && .venv/bin/pytest -q -m integration -s
      - name: Install Playwright Chromium
        run: pnpm --filter @campuscart/student-web exec playwright install --with-deps chromium
      - name: Student website end-to-end (desktop + mobile viewports)
        run: |
          bash scripts/web-env.sh student-web http://localhost:8100
          cd apps/student-web && CI=1 pnpm exec playwright test
      - name: Student mobile app end-to-end (React Native Web build)
        run: |
          bash scripts/web-env.sh student-mobile http://localhost:8100
          cd apps/student-mobile && pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            apps/student-web/test-results
            apps/student-mobile/test-results
