[project]
name = "campuscart-ml"
version = "0.0.0"
description = "CampusCart offline RL: simulated environments, reward design, baselines (Phase 6A); training in 6B"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.2,<2",
    "numpy>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "NPY"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["campuscart_ml", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["gymnasium.*"]
ignore_missing_imports = true
